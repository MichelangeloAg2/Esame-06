<section>
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">

        <!-- Indicators -->
        <div class="carousel-indicators">
            <button *ngFor="let item of carouselItems; let i = index" type="button" data-bs-target="#carouselExample"
                [attr.data-bs-slide-to]="i" [class.active]="i === 0">
            </button>
        </div>

        <!-- Slides -->
        <div class="carousel-inner">
            <div *ngFor="let item of carouselItems; let i = index" class="carousel-item" [class.active]="i === 0">

                <img [src]="item.img" class="d-block w-100">

                <div class="carousel-caption d-none d-lg-block">
                    <h5>{{ item.title }}</h5>
                    <p>{{ item.text }}</p>
                </div>

            </div>
        </div>

        <!-- Frecce -->
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>
</section>


<section>
    <h2 class="m-3">Continua a guardare...</h2>

    <div class="row p-2 g-3">
        <div class="col-12 col-sm-6 col-lg-3" *ngFor="let movie of continueWatching">

            <div class="card">
                <img [src]="movie.img" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">{{ movie.title }}</h5>
                    <p class="card-text">{{ movie.description }}</p>
                    <button class="btn btn-primary">
                        Vai al film
                    </button>
                </div>
            </div>

        </div>
    </div>
</section>

<section>
    <div class="container-fluid my-4">
        <h3 class="text-white mb-3">Popolari su CodeX</h3>

        <div class="d-flex flex-row flex-nowrap overflow-auto">

            <div class="movie-card me-3" *ngFor="let movie of popularMovies">

                <div class="card bg-dark text-white border-0 position-relative">

                    <!-- Immagine -->
                    <img [src]="movie.img" class="card-img-top">

                    <!-- Pulsante overlay -->
                    <button class="play-btn">
                        <i class="fa fa-play"></i>
                        <span>Riproduci</span>
                    </button>

                    <!-- Corpo -->
                    <div class="card-body p-2">
                        <p class="card-text">{{ movie.title }}</p>
                    </div>

                    <!-- Info extra -->
                    <div class="extra-info p-2">
                        {{ movie.year }} • {{ movie.genre }} <br>
                        Voto: {{ movie.rating }}
                    </div>

                </div>

            </div>


        </div>
    </div>
</section>
