<h1>Catalogo Serie TV</h1>

<!-- CONTINUA A GUARDARE -->
<section *ngIf="serieNonFinite.length">
    <div class="container-fluid my-4">
        <h3 class="text-white mb-3">Continua a guardare</h3>

        <div class="movie-row">
            <app-movie-card *ngFor="let serie of serieNonFinite" [contenuto]="serie">
            </app-movie-card>
        </div>
    </div>
</section>

<!-- CATEGORIE DINAMICHE -->
<section *ngFor="let cat of categorieSerie">

    <div class="container-fluid my-4">

        <h3 class="text-white mb-3">
            Serie {{ cat.nome }}
        </h3>

        <div class="movie-row">

            <app-movie-card *ngFor="let serie of cat.lista" [contenuto]="serie">
            </app-movie-card>

        </div>

    </div>

</section>

<router-outlet></router-outlet>
