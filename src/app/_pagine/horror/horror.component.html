<h1>La paura fa novanta... E di più!</h1>

<!--  FILM HORROR -->
<section>
    <div class="container-fluid my-4">
        <h3 class="text-white mb-3">Hai paura del buio? Perché non guardi dietro la porta?</h3>

        <div class="movie-row">
            <app-movie-card *ngFor="let film of filmHorror" [contenuto]="film">
            </app-movie-card>
        </div>
    </div>
</section>

<!--  SERIE HORROR -->
<section>
    <div class="container-fluid my-4">
        <h3 class="text-white mb-3">Splatter? No, molto di più!</h3>

        <div class="movie-row">
            <app-movie-card *ngFor="let serie of serieHorror" [contenuto]="serie">
            </app-movie-card>
        </div>
    </div>
</section>
