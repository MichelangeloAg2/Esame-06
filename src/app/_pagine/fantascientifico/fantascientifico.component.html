<h1>Oltre i cieli... Dell'Universo</h1>

<!--  FILM FANTASCIENZA -->
<section>
    <div class="container-fluid my-4">
        <h3 class="text-white mb-3">Blaster&Esplorazione</h3>

        <div class="movie-row">
            <app-movie-card *ngFor="let film of filmFantascienza" [contenuto]="film">
            </app-movie-card>
        </div>
    </div>
</section>

<!--  SERIE FANTASCIENTIFICHE -->
<section>
    <div class="container-fluid my-4">
        <h3 class="text-white mb-3">Più di una semplice avventura!</h3>

        <div class="movie-row">
            <app-movie-card *ngFor="let serie of serieFantascienza" [contenuto]="serie">
            </app-movie-card>
        </div>
    </div>
</section>
