<h1>Per i più piccoli...</h1>

<!--  FILM ANIMAZIONE -->
<section>
    <div class="container-fluid my-4">
        <h3 class="text-white mb-3">Dal Giappone all'Italia, con furore!</h3>

        <div class="movie-row">
            <app-movie-card *ngFor="let film of filmAnimazione" [contenuto]="film">
            </app-movie-card>
        </div>
    </div>
</section>

<!--  SERIE ANIMAZIONE -->
<section>
    <div class="container-fluid my-4">
        <h3 class="text-white mb-3">Amante degli anime, fermati un attimo!</h3>

        <div class="movie-row">
            <app-movie-card *ngFor="let serie of serieAnimazione" [contenuto]="serie">
            </app-movie-card>
        </div>
    </div>
</section>
