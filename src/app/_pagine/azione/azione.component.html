<h1>Spionaggio internazionale o Azione dinamica?</h1>

<!--  FILM AZIONE -->
<section>
    <div class="container-fluid my-4">
        <h3 class="text-white mb-3">Bombe, Spie e quanto altro ancora!</h3>

        <div class="movie-row">
            <app-movie-card *ngFor="let film of filmAzione" [contenuto]="film">
            </app-movie-card>
        </div>
    </div>
</section>

<!--  SERIE AZIONE -->
<section>
    <div class="container-fluid my-4">
        <h3 class="text-white mb-3">Colpi di pistola e molto altro, in tutti gli episodi!</h3>

        <div class="movie-row">
            <app-movie-card *ngFor="let serie of serieAzione" [contenuto]="serie">
            </app-movie-card>
        </div>
    </div>
</section>
