<h1>Drama... Per tutti!</h1>

<!--  FILM DRAMMATICI -->
<section>
    <div class="container-fluid my-4">
        <h3 class="text-white mb-3">Spunti di Vita reali!</h3>

        <div class="movie-row">
            <app-movie-card *ngFor="let film of filmDrammatico" [contenuto]="film">
            </app-movie-card>
        </div>
    </div>
</section>

<!--  SERIE DRAMMATICHE -->
<section>
    <div class="container-fluid my-4">
        <h3 class="text-white mb-3">Drama Queen or DramaKing?</h3>

        <div class="movie-row">
            <app-movie-card *ngFor="let serie of serieDrammatico" [contenuto]="serie">
            </app-movie-card>
        </div>
    </div>
</section>
